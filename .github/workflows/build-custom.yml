name: Build Custom RustDesk Client

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    env:
      RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
      RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Patch RustDesk server/key into source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $configPath = "libs/hbb_common/src/config.rs"
          $content = Get-Content -Raw $configPath

          $newContent = $content -replace '(?s)pub const RENDEZVOUS_SERVERS:.*?;', "pub const RENDEZVOUS_SERVERS: &[&str] = &[`"$env:RENDEZVOUS_SERVER`"];"
          $newContent = $newContent -replace '(?s)pub const RS_PUB_KEY:.*?;', "pub const RS_PUB_KEY: &str = `"$env:RS_PUB_KEY`";"

          if ($newContent -eq $content) { throw "Patch did not change anything - pattern not found in config.rs" }

          Set-Content -Path $configPath -Value $newContent
          Write-Host "Patched RENDEZVOUS_SERVERS and RS_PUB_KEY into $configPath"
          Select-String -Path $configPath -Pattern "RENDEZVOUS_SERVERS|RS_PUB_KEY"

      - uses: dtolnay/rust-toolchain@stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.22.3

      - name: Install nasm
        uses: ilammy/setup-nasm@v1

      - name: Install vcpkg deps
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git clone https://github.com/microsoft/vcpkg
          .\vcpkg\bootstrap-vcpkg.bat
          .\vcpkg\vcpkg install libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static aom:x64-windows-static --classic
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed with exit code $LASTEXITCODE" }
          echo "VCPKG_ROOT=$PWD\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify vcpkg headers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path ".\vcpkg\installed\x64-windows-static\include\opus\opus_multistream.h")) { throw "opus header missing" }
          if (-not (Test-Path ".\vcpkg\installed\x64-windows-static\include\vpx\vp8.h")) { throw "vpx header missing" }
          Write-Host "All required headers found."

      - name: Patch pubspec for Flutter 3.22.3
        shell: pwsh
        run: |
          (Get-Content flutter/pubspec.yaml) -replace 'extended_text: 14.0.0', 'extended_text: 13.0.0' | Set-Content flutter/pubspec.yaml

      - name: Install flutter_rust_bridge_codegen
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid
          cd flutter
          flutter pub get
          cd ..

      - name: Generate bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart
          if (-not (Test-Path ".\src\bridge_generated.rs")) { throw "bridge_generated.rs was not created" }

      - name: Build
        run: |
          python build.py --portable --flutter

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-lunexa-client
          path: |
            **/*.exe
